<style>
/* Layout: one dark stage. Loader = star centred with a counter beneath; reveal = wordmark, COMING SOON, three icon links, stacked on the centre line. */
:root {
  --void: #040504;         /* the room: black with a faint green cast */
  --void-lift: #0d110c;    /* centre falloff */
  --chrome: #dfe2dc;       /* polished metal, primary text */
  --chrome-dim: #858b81;   /* secondary text, hairline icons at rest */
  --lime: #b8ff3c;         /* the edge light green from the logo */
  --hair: rgba(223,226,220,.18);
  --font-wide: "Michroma", "Eurostile", "Bank Gothic", "Arial Narrow", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background-color: var(--void);
  background-image: radial-gradient(110% 80% at 50% 46%, var(--void-lift) 0%, var(--void) 60%);
  color: var(--chrome);
  font-family: var(--font-wide);
  -webkit-font-smoothing: antialiased;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 1; }

/* ---------- Loader ---------- */
.loader {
  position: fixed; inset: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
  padding-inline: 16px;
  transition: opacity .5s ease;
}
.star-box { width: min(44vmin, 360px); aspect-ratio: 768 / 753; max-width: 100%; position: relative; }
.star-box::before {
  content: ""; position: absolute; inset: -30%;
  background: radial-gradient(closest-side, rgba(200,240,170,.07), rgba(184,255,60,.02) 45%, transparent 72%);
  animation: breathe 2.6s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
.counter {
  display: flex; align-items: center; gap: 14px;
  font-family: var(--font-mono); font-weight: 300; font-size: 11px; letter-spacing: .32em; text-transform: uppercase;
  color: var(--chrome-dim);
}
.counter .num { color: var(--chrome); font-variant-numeric: tabular-nums; min-width: 3.2ch; }
.counter .bar { width: 96px; height: 1px; background: var(--hair); position: relative; overflow: hidden; }
.counter .bar i { position: absolute; inset: 0; background: var(--lime); transform-origin: left; transform: scaleX(0); box-shadow: 0 0 4px rgba(184,255,60,.4); opacity: .8; }
body.leaving .loader { opacity: 0; }
body.revealed .loader { display: none; }

/* ---------- Teaser ---------- */
.teaser {
  position: fixed; inset: 0; z-index: 3;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(28px, 5vh, 52px);
  padding-inline: 16px;
  pointer-events: none;
}
.logo-box { width: min(86vw, 1080px); aspect-ratio: 1562 / 287; max-width: 100%; }
.logo-box img { width: 100%; height: 100%; display: none; }
.soon {
  margin: 0; font-weight: 400;
  font-size: clamp(13px, 1.9vw, 22px);
  letter-spacing: .62em; padding-left: .62em; /* keeps the tracked word optically centred */
  text-transform: uppercase; white-space: nowrap;
  background: linear-gradient(100deg, var(--chrome-dim) 0%, var(--chrome-dim) 38%, #ffffff 47%, #ffffff 50%, #ffffff 53%, var(--chrome-dim) 62%, var(--chrome-dim) 100%);
  background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: sweep 5.2s linear infinite;
}
@keyframes sweep { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.links { display: flex; gap: 18px; pointer-events: auto; }
.links a {
  width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--hair); color: var(--chrome-dim);
  transition: color .25s, border-color .25s, box-shadow .25s, transform .25s;
}
.links a svg { width: 19px; height: 19px; }
.links a:hover, .links a:focus-visible {
  color: var(--lime); border-color: var(--lime); outline: none;
  box-shadow: 0 0 18px rgba(184,255,60,.35), inset 0 0 10px rgba(184,255,60,.15);
  transform: translateY(-2px);
}
.toast {
  position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 4;
  transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--chrome);
  border: 1px solid var(--hair); background: rgba(4,5,4,.85); padding: 9px 16px; border-radius: 2px;
  transition: opacity .25s, transform .25s; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  text-align: center; font-family: var(--font-mono); font-weight: 300;
  font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--chrome-dim);
}

/* Entrance: text and links rise in once the logo has been revealed */
.soon, .links, .foot { opacity: 0; transform: translateY(10px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
body.revealed .soon { opacity: 1; transform: none; transition-delay: .15s; }
body.revealed .links { opacity: 1; transform: none; transition-delay: .4s; }
body.revealed .foot { opacity: 1; transform: none; transition-delay: .65s; }

.flare {
  position: fixed; z-index: 2; left: 50%; height: 2px; width: min(96vw, 1300px);
  transform: translate(-50%, -50%) scaleX(0); opacity: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(184,255,60,.5) 25%, #fff 50%, rgba(184,255,60,.5) 75%, transparent);
  box-shadow: 0 0 24px 4px rgba(184,255,60,.35);
}
.flare.go { animation: flare 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes flare { 0% { opacity: 0; transform: translate(-50%,-50%) scaleX(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scaleX(1); } }

/* No WebGL: show the still logo, skip the loader */
body.nogl .logo-box img { display: block; }
body.nogl .loader { display: none; }

@media (max-width: 480px) {
  .links { gap: 14px; }
  .soon { letter-spacing: .5em; padding-left: .5em; }
}
@media (prefers-reduced-motion: reduce) {
  .soon { animation-duration: 12s; }
  .star-box::before { animation: none; }
}

/* ---------- Neon side glows: soft, irregular green haze drifting along the left and right edges ---------- */
.neon { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.neon span {
  position: absolute;
  /* Several offset ellipses in one fill, inside a morphing organic outline, so no glow reads as a circle */
  background:
    radial-gradient(ellipse 60% 38% at 38% 30%, rgba(184,255,60,.42), rgba(184,255,60,0) 70%),
    radial-gradient(ellipse 34% 52% at 66% 64%, rgba(120,255,70,.32), rgba(120,255,70,0) 72%),
    radial-gradient(ellipse 48% 24% at 46% 82%, rgba(210,255,90,.22), rgba(210,255,90,0) 75%);
  border-radius: 63% 37% 54% 46% / 42% 58% 38% 62%;
  filter: blur(48px); mix-blend-mode: screen;
  opacity: .14; transition: opacity 2s ease;
  will-change: transform, border-radius;
}
.neon .n1 { width: 30vmax; height: 56vmax; left: -19vmax; top: 2vh;   animation: driftL 21s ease-in-out infinite alternate, morph 14s ease-in-out infinite alternate; }
.neon .n2 { width: 24vmax; height: 20vmax; left: -10vmax; bottom: -6vh; animation: driftL2 16s ease-in-out infinite alternate, morph 11s ease-in-out infinite alternate-reverse;
  background: radial-gradient(ellipse 70% 40% at 40% 45%, rgba(70,255,150,.32), rgba(70,255,150,0) 70%), radial-gradient(ellipse 35% 60% at 70% 60%, rgba(184,255,60,.22), rgba(184,255,60,0) 72%); }
.neon .n3 { width: 34vmax; height: 50vmax; right: -22vmax; top: -12vh; animation: driftR 23s ease-in-out infinite alternate, morph 17s ease-in-out infinite alternate-reverse; transform: rotate(-18deg); }
.neon .n4 { width: 20vmax; height: 30vmax; right: -9vmax;  bottom: 4vh;  animation: driftR2 15s ease-in-out infinite alternate, morph 12s ease-in-out infinite alternate;
  background: radial-gradient(ellipse 45% 65% at 55% 40%, rgba(214,255,70,.3), rgba(214,255,70,0) 70%), radial-gradient(ellipse 60% 30% at 35% 75%, rgba(120,255,70,.2), rgba(120,255,70,0) 72%); }
body.revealed .neon span { opacity: .32; }
@keyframes morph {
  0%   { border-radius: 63% 37% 54% 46% / 42% 58% 38% 62%; }
  33%  { border-radius: 40% 60% 34% 66% / 61% 37% 63% 39%; }
  66%  { border-radius: 55% 45% 70% 30% / 33% 52% 48% 67%; }
  100% { border-radius: 34% 66% 45% 55% / 55% 30% 70% 45%; }
}
@keyframes driftL  { 0% { transform: translate(0, 0) rotate(8deg); }    50% { transform: translate(3vmax, 12vh) rotate(-6deg) scale(1.08, .94); }  100% { transform: translate(1vmax, 26vh) rotate(14deg) scale(.94, 1.06); } }
@keyframes driftL2 { 0% { transform: translate(0, 0) rotate(-10deg); } 100% { transform: translate(4vmax, -30vh) rotate(16deg) scale(1.12, .9); } }
@keyframes driftR  { 0% { transform: translate(0, 0) rotate(-18deg); } 50% { transform: translate(-4vmax, 16vh) rotate(-4deg) scale(.92, 1.1); } 100% { transform: translate(-1vmax, 34vh) rotate(-26deg) scale(1.06, .95); } }
@keyframes driftR2 { 0% { transform: translate(0, 0) rotate(12deg); }  100% { transform: translate(-3vmax, -36vh) rotate(-10deg) scale(.9, 1.12); } }
@media (max-width: 600px) { .neon span { filter: blur(34px); } .neon .n1, .neon .n3 { width: 42vmax; } }
@media (prefers-reduced-motion: reduce) { .neon span { animation-duration: 60s, 60s !important; } }
</style>
</head>

        float d1 = mod(th - t*2.4 + 3.14159, 6.28318) - 3.14159;
        float d2 = mod(th + t*1.7 + 1.0 + 3.14159, 6.28318) - 3.14159;
        float L1 = head(d1, 0.0, -1.0, 9.0, 1.6);
        float L2 = head(d2, 0.0, 1.0, 9.0, 1.6);
        float L3 = head(r, fract(t/1.9)*0.75, 1.0, 900.0, 30.0);
        light = white*L1 + lime*L2*1.15 + lime*L3*0.8;
        peak = max(L1, L2);
      }
      // Wordmark lights are kept quieter and closer to white than the star's.
      if (uMode < 0.5) light = mix(light, vec3(dot(light, vec3(0.333))), 0.55) * 0.45;
      else light = mix(light, vec3(dot(light, vec3(0.333))), 0.6) * 0.55;
      light *= uBoost;
      float metal = smoothstep(0.2, 0.9, dot(base.rgb, vec3(0.333))) * a;
      float hot = uMode < 0.5 ? 0.35 : 0.45;
      vec3 glow = light * (edge*1.5 + halo*1.2) + white * pow(peak*edge, 3.0) * hot * uBoost;
      vec3 col = base.rgb * a + glow + light * metal * 0.28;
      float alpha = a;
      if (uMode < 0.5) {
        float x = abs(vUv.x - 0.5);
        float front = uReveal * 0.62;
        float m = smoothstep(front, front - 0.06, x);
        col = col * m;
        alpha *= m;
      }
      col = min(col, vec3(1.6));
      gl_FragColor = vec4(col * uOpacity, alpha * uOpacity);
    }`;

  function makeMark(src, w, h, mode) {
    const tex = new THREE.TextureLoader().load(src, () => { mark.ready = true; }, undefined, () => { canvas.hidden = true; noGL(); });
    tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
    tex.premultiplyAlpha = false;
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTex: { value: tex }, uTexel: { value: new THREE.Vector2(1 / w, 1 / h) },
        uTime: { value: 0 }, uMode: { value: mode }, uReveal: { value: mode === 0 ? 0 : 1 },
        uOpacity: { value: 0 }, uAspect: { value: w / h }, uBoost: { value: 1 }
      },
      vertexShader: vert, fragmentShader: frag, transparent: true, depthTest: false, depthWrite: false,
      blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
      blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    scene.add(mesh);
    const mark = { mesh, u: mat.uniforms, ready: false };
    return mark;
  }
  const logo = makeMark(LOGO_SRC, 1562, 287, 0);
  const star = makeMark(STAR_SRC, 768, 753, 1);

  const logoBox = document.getElementById('logoBox');
  const starBox = document.getElementById('starBox');
  let W = 1, H = 1;
  function placeOn(mesh, el) {
    const r = el.getBoundingClientRect();
    mesh.position.set(r.left + r.width / 2 - W / 2, H / 2 - (r.top + r.height / 2), 0);
    mesh.userData.w = r.width; mesh.userData.h = r.height;
    mesh.userData.cx = r.left + r.width / 2; mesh.userData.cy = r.top + r.height / 2;
  }
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    renderer.setSize(W, H, false);
    camera.left = -W / 2; camera.right = W / 2; camera.top = H / 2; camera.bottom = -H / 2;
    camera.updateProjectionMatrix();
    placeOn(logo.mesh, logoBox);
    if (!body.classList.contains('revealed')) placeOn(star.mesh, starBox);
    // The flare line sits on the wordmark's centre line.
  }
  window.addEventListener('resize', resize);
  resize();
  logo.mesh.scale.set(logo.mesh.userData.w, logo.mesh.userData.h, 1);

  // ---------- Timeline ----------
  const LOAD_MS = reduce ? 1200 : 3400;
  const bar = document.getElementById('bar');
  let fontsReady = false;
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { fontsReady = true; });
  setTimeout(() => { fontsReady = true; }, 2500);

  const ease = x => 1 - Math.pow(1 - x, 3);
  const easeIn = x => x * x * x;
  let phase = 'loading', phaseStart = 0, start = null, shown = -1;

  function frame(now) {
    if (start === null) start = now;
    const t = (now - start) / 1000;
    const timeScale = reduce ? 0.45 : 1;
    logo.u.uTime.value = t * timeScale;
    star.u.uTime.value = t * timeScale;

    if (phase === 'loading') {
      const p = Math.min(1, (now - start) / LOAD_MS);
      const shownP = Math.floor(ease(p) * 100);
      if (shownP !== shown) { shown = shownP; bar.style.transform = 'scaleX(' + ease(p) + ')'; }
      star.u.uOpacity.value = Math.min(1, t / 0.7);
      const s = 0.86 + 0.14 * ease(Math.min(1, t / 1.2));
      star.mesh.scale.set(star.mesh.userData.w * s, star.mesh.userData.h * s, 1);
      star.mesh.rotation.z = -t * 0.22;
      if (p >= 1 && logo.ready && star.ready && fontsReady) { phase = 'transition'; phaseStart = now; body.classList.add('leaving'); }
    } else if (phase === 'transition') {
      const k = (now - phaseStart) / 1000;
      // Star spins up, flares and collapses into the wordmark's centre.
      const a = Math.min(1, k / 0.65);
      const sx = star.mesh.userData.cx, sy = star.mesh.userData.cy;
      const lx = logo.mesh.userData.cx, ly = logo.mesh.userData.cy;
      const e = easeIn(a);
      star.mesh.position.set((sx + (lx - sx) * e) - W / 2, H / 2 - (sy + (ly - sy) * e), 0);
      const s = 1 - e;
      star.mesh.scale.set(star.mesh.userData.w * Math.max(s, 0.0001), star.mesh.userData.h * Math.max(s, 0.0001), 1);
      star.mesh.rotation.z -= 0.02 + e * 0.35;
      star.u.uBoost.value = 1 + e * 2.5;
      star.u.uOpacity.value = 1 - Math.max(0, (a - 0.8) / 0.2);
      // Wordmark opens outward from the centre line.
      const r = Math.max(0, Math.min(1, (k - 0.6) / 1.1));
      logo.u.uOpacity.value = r > 0 ? 1 : 0;
      logo.u.uReveal.value = ease(r) * 1.02;
      if (k >= 1.3 && !body.classList.contains('revealed')) body.classList.add('revealed');
      if (r >= 1) { phase = 'live'; star.mesh.visible = false; logo.u.uReveal.value = 1.02; }
    }
    logo.mesh.scale.set(logo.mesh.userData.w, logo.mesh.userData.h, 1);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
